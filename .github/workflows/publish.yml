name: Publish container set
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}
      prefix:
        value: ${{ jobs.prepare.outputs.prefix }}
permissions:
  contents: read
  packages: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prefix: ${{ steps.metadata.outputs.prefix }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
      - id: metadata
        env:
          CHANNEL: ${{ inputs.channel }}
        run: python3 scripts/release/metadata.py --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --channel "$CHANNEL" --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  smoke:
    needs: [prepare, check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: canopy-release-test:smoke
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Verify bundled codec limits, photo formats and PDF/image OCR without a socket
        run: bash scripts/release/codecs.sh
      - name: Verify actual deployment and queued photo processing
        run: python3 scripts/release/smoke.py
  images:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        env:
          PREFIX: ${{ needs.prepare.outputs.prefix }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$PREFIX:$VERSION" >/dev/null 2>&1; then
            echo "Version already exists; use a new version or rerun only failed jobs."
            exit 1
          fi
      - name: Publish immutable version
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.prepare.outputs.prefix }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$DIGEST" > app.digest
      - uses: actions/upload-artifact@v4
        with:
          name: image-app
          path: app.digest
  bundle:
    needs: [prepare, images]
    runs-on: ubuntu-latest
    env:
      PREFIX: ${{ needs.prepare.outputs.prefix }}
      VERSION: ${{ needs.prepare.outputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create deployment bundle and digest manifest
        run: python3 scripts/release/bundle.py
      - name: Advance dev only after the whole image set succeeds
        if: inputs.channel == 'dev'
        run: |
          digest=$(cat digests/app.digest)
          docker buildx imagetools create --tag "$PREFIX:dev" "$PREFIX@$digest"
      - uses: actions/upload-artifact@v4
        with:
          name: canopy-release
          path: release/*
          if-no-files-found: error
