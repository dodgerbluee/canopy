services:
  canopy:
    image: ${CANOPY_IMAGE_PREFIX:-ghcr.io/dodgerbluee/canopy}:${CANOPY_VERSION:-1.1.0}
    restart: unless-stopped
    ports:
      - "${CANOPY_PORT:-7080}:80"
    environment:
      DATABASE_URL: postgres://canopy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/canopy
      CANOPY_PUBLIC_URL: ${CANOPY_PUBLIC_URL:-http://localhost:7080}
      CANOPY_INITIAL_PASSWORD: ${CANOPY_INITIAL_PASSWORD:-}
      TMPDIR: ${CANOPY_WORK_DIR:-/srv/canopy/work}
    volumes:
      - canopy-data:/var/lib/canopy
      - ${CANOPY_WORK_DIR:-/srv/canopy/work}:${CANOPY_WORK_DIR:-/srv/canopy/work}
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 3m

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: canopy
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U canopy -d canopy"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  canopy-data:
  postgres-data:
