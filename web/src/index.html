<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canopy</title>
    <script>
      // Apply the browser/explicit preference before styles paint, including setup.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem('canopy-theme');
        } catch {}
        const theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/icons/canopy.f5453d754fa8.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/canopy-32.e08db3e91005.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/canopy.492b070d30ce.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/canopy-180.dcd868d450d2.png" />
    <link rel="mask-icon" color="#34573b" href="/icons/canopy-mask.6e17b95e69dd.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
