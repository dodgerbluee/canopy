mutation CorrectOccurrenceCompletion($input: CorrectOccurrenceCompletionInput!, $clientMutationId: String) {
  correctOccurrenceCompletion(input: $input, clientMutationId: $clientMutationId) {
    occurrence {
      ...CareOccurrenceFields
    }
