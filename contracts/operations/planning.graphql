  refreshPlantingGuidance(input: $input, clientMutationId: $clientMutationId) {
    plan { ...PlantingPlanFields latestGuidance { id generation state message retrievedAt } acceptedGuidance { id generation state } }
    problems { code field message currentRevision }
    clientMutationId
  }
}

fragment PlantingScheduleSelectionFields on PlantingScheduleSelection {
  version factId windowIndex year
  assumptions { hemisphere anchors { kind on } }
  supportedPeriod { ...PlantingPeriodFields }
  confirmedAt
}
query PlantingSchedule($planId: ID!, $input: PlantingScheduleInput!, $first: Int, $after: String) {
  plantingSchedule(planId: $planId, input: $input, first: $first, after: $after) {
    planId revision guidanceGeneration timezone today
    targetPeriod { ...PlantingPeriodFields }
    targetHemisphere targetStatus targetDisplayMonths { from to } targetVisible
    acceptedSchedule { ...PlantingScheduleSelectionFields }
    sourceSnapshotId guidanceState guidanceCurrent message
    assumptions { hemisphere anchors { kind on } }
    items {
      id factId windowIndex year phase label resolution message status
      period { ...PlantingPeriodFields }
      displayMonths { from to }
      continuesBefore continuesAfter estimated firstHarvestUnknown selectable
    }
    pageInfo { hasNextPage endCursor }
  }
}
mutation ConfirmPlantingSchedule($input: ConfirmPlantingScheduleInput!, $clientMutationId: String) {
  confirmPlantingSchedule(input: $input, clientMutationId: $clientMutationId) {
    plan {
      ...PlantingPlanFields
      acceptedSchedule { ...PlantingScheduleSelectionFields }
      acceptedGuidance { id generation state }
    }
    problems { code field message currentRevision }
    clientMutationId
  }
}

query PlantingBoard($input: PlantingScheduleInput!, $first: Int, $after: String, $filter: PlantingPlanFilter) {
  plantingBoard(input: $input, first: $first, after: $after, filter: $filter) {
    timezone today
    items {
      plan { ...PlantingPlanFields }
      schedule {
        planId revision guidanceGeneration sourceSnapshotId guidanceState guidanceCurrent message
        targetStatus targetDisplayMonths { from to } targetVisible
        acceptedSchedule { ...PlantingScheduleSelectionFields }
        items {
          id factId windowIndex year phase label resolution message status
          period { ...PlantingPeriodFields }
          displayMonths { from to }
          continuesBefore continuesAfter estimated firstHarvestUnknown selectable
        }
        pageInfo { hasNextPage endCursor }
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}
