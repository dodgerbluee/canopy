mutation CompleteOccurrence($input: CompleteOccurrenceInput!, $clientMutationId: String) {
  completeOccurrence(input: $input, clientMutationId: $clientMutationId) {
    occurrence {
      ...CareOccurrenceFields
    }
    activity {
      ...ActivityFields
    }
    nextOccurrence {
      ...CareOccurrenceFields
    }
    problems {
      ...ProblemFields
    }
    clientMutationId
  }
}

mutation SkipOccurrence($input: SkipOccurrenceInput!, $clientMutationId: String) {
