query Locations {
  locations {
    ...LocationFields
  }
}

query Tags($first: Int, $after: String, $filter: TagFilter) {
  tags(first: $first, after: $after, filter: $filter) {
    items {
      id
      label
      archivedAt
      revision
      createdAt
      updatedAt
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query Plants($first: Int, $after: String, $filter: PlantFilter, $order: PlantOrder) {
  plants(first: $first, after: $after, filter: $filter, order: $order) {
    items {
      ...PlantFields
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

query PlantDetail($id: ID!) {
  plant(id: $id) {
    ...PlantFields
  }
}

mutation CreatePlant($input: CreatePlantInput!, $clientMutationId: String) {
  createPlant(input: $input, clientMutationId: $clientMutationId) {
    plant {
      ...PlantFields
    }
    problems {
      code
      field
      message
      currentRevision
    }
    clientMutationId
  }
}

