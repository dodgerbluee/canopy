query PendingUploads($first: Int, $after: String) {
  pendingUploads(first: $first, after: $after) {
    items {
      ...AssetFields
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

mutation ReserveUpload($input: ReserveUploadInput!, $clientMutationId: String) {
  reserveUpload(input: $input, clientMutationId: $clientMutationId) {
    asset {
      ...AssetFields
    }
    problems {
      code
      field
      message
      currentRevision
    }
    clientMutationId
  }
}

mutation FinalizeUpload($input: FinalizeUploadInput!, $clientMutationId: String) {
  finalizeUpload(input: $input, clientMutationId: $clientMutationId) {
